<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Callback TikTok</title><style>body{font-family:system-ui,sans-serif;max-width:720px;margin:40px auto;padding:0 16px;line-height:1.6;color:#222}h1{font-size:1.6rem}code{background:#f2f2f2;padding:2px 6px;border-radius:4px;word-break:break-all}button{padding:8px 14px;cursor:pointer}</style></head><body>
<h1>Autorisation TikTok</h1>
<div id="out">Chargement…</div>
<p><small>Rien n'est enregistré ni envoyé : le code est seulement affiché ici. Il expire au bout de quelques minutes et ne sert qu'une fois.</small></p>
<script>
const p = new URLSearchParams(location.search);
const out = document.getElementById('out');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
if (p.get('error')) {
  out.innerHTML = '<p>❌ Erreur : <code>' + esc(p.get('error')) + '</code><br>' + esc(p.get('error_description') || '') + '</p>';
} else if (p.get('code')) {
  const code = p.get('code');
  out.innerHTML = '<p>✅ Code reçu (state : <code>' + esc(p.get('state') || '-') + '</code>)</p>'
    + '<p><code id="c">' + esc(code) + '</code></p><button id="b">Copier le code</button>';
  document.getElementById('b').onclick = () => navigator.clipboard.writeText(code)
    .then(() => document.getElementById('b').textContent = 'Copié ✔');
  history.replaceState(null, '', location.pathname);
} else {
  out.textContent = 'Aucun code dans l’URL.';
}
</script>
</body></html>
